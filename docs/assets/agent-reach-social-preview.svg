<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc">
<title id="title">Agent Reach — English / International Edition</title>
<desc id="desc">High-resolution vector banner with an AI eye, global network, and Agent Reach title.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020912"/>
    <stop offset="0.55" stop-color="#07182a"/>
    <stop offset="1" stop-color="#03111e"/>
  </linearGradient>
  <linearGradient id="cyanGreen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#28c7ff"/>
    <stop offset="0.55" stop-color="#25e0d0"/>
    <stop offset="1" stop-color="#4dff8a"/>
  </linearGradient>
  <radialGradient id="globe" cx="38%" cy="32%" r="70%">
    <stop offset="0" stop-color="#1ba8ff" stop-opacity=".85"/>
    <stop offset=".45" stop-color="#0875c7" stop-opacity=".48"/>
    <stop offset="1" stop-color="#032545" stop-opacity=".9"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="globeClip"><circle cx="1328" cy="342" r="280"/></clipPath>
</defs>

<rect width="1774" height="887" fill="url(#bg)"/>

<!-- subtle stars / grid -->
<g fill="#5ad8ff" opacity=".22">
