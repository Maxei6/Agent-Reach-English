  <line x1="760" y1="80" x2="1740" y2="80"/><line x1="760" y1="132" x2="1740" y2="132"/><line x1="760" y1="184" x2="1740" y2="184"/><line x1="760" y1="236" x2="1740" y2="236"/><line x1="760" y1="288" x2="1740" y2="288"/><line x1="760" y1="340" x2="1740" y2="340"/><line x1="760" y1="392" x2="1740" y2="392"/><line x1="760" y1="444" x2="1740" y2="444"/><line x1="760" y1="496" x2="1740" y2="496"/><line x1="760" y1="548" x2="1740" y2="548"/><line x1="760" y1="600" x2="1740" y2="600"/>
</g>

