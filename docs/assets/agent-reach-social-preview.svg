  <rect x="0" y="0" width="300" height="178" rx="16" fill="#061521" stroke="#23cfff" stroke-width="2" opacity=".93"/>
  <circle cx="20" cy="19" r="5" fill="#4dff8a"/><circle cx="38" cy="19" r="5" fill="#23cfff"/><circle cx="56" cy="19" r="5" fill="#f5d762"/>
