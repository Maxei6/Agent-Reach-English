<!-- typography -->
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
  <text x="78" y="482" font-size="138" font-weight="800" fill="#f8fbff" letter-spacing="-5">Agent</text>
  <text x="540" y="482" font-size="138" font-weight="800" fill="url(#cyanGreen)" letter-spacing="-5">Reach</text>
